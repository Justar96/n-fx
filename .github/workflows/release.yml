name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check whether a GitHub Release is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-nfx\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version must use <upstream-version>-nfx.<revision>"
            exit 1
          fi
          UPSTREAM_BASE="${VERSION%%-nfx.*}"
          UPSTREAM_SOURCE=$(curl -fsSL https://raw.githubusercontent.com/vercel-labs/fx/main/src/main.zig)
          UPSTREAM_VERSION=$(sed -n 's/^pub const version = "\([^"]*\)";.*/\1/p' <<< "$UPSTREAM_SOURCE" | head -1)
          if [ "$UPSTREAM_BASE" != "$UPSTREAM_VERSION" ]; then
            echo "::error::n-fx base ${UPSTREAM_BASE} does not match upstream main ${UPSTREAM_VERSION}"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          CHANNEL_VERSION=$(gh release download nfx-stable-channel \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.txt \
            --output - 2>/dev/null || true)
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && gh release view v0.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && [ "$CHANNEL_VERSION" = "$TAG" ] \
            && [ "$LATEST_TAG" = v0.0.5 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Release ${TAG} and stable pointers already exist"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Release ${TAG} or a stable pointer requires publication"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/n-fx-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fx "$package_dir/nfx"
          cp LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "nfx-${{ matrix.name }}.tar.gz" -C "$package_dir" nfx LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "nfx-${{ matrix.name }}.tar.gz" > "nfx-${{ matrix.name }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nfx-${{ matrix.name }}
          path: |
            nfx-${{ matrix.name }}.tar.gz
            nfx-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nfx-*
          merge-multiple: true

      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_TAG" > latest.txt
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          if [ "$(wc -l < /tmp/release-notes.md)" -lt 2 ]; then
            echo "::error::No release notes found between release markers"
            exit 1
          fi
          bash -n install.sh
          sha256sum --check nfx-*.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/release-notes.md
          prerelease: false
          make_latest: false
          files: |
            nfx-*.tar.gz
            nfx-*.tar.gz.sha256
            install.sh
            latest.txt

      - name: Publish stable channel and legacy compatibility bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANNEL_TAG="nfx-stable-channel"
          BRIDGE_TAG="v0.0.5"

          if gh release view "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$CHANNEL_TAG" latest.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$CHANNEL_TAG" latest.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "n-fx stable channel" \
              --notes "Mutable stable-channel metadata for n-fx updaters." \
              --prerelease
          fi

          if ! gh release view "$BRIDGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            bridge_dir="$RUNNER_TEMP/nfx-legacy-bridge"
            mkdir -p "$bridge_dir"
            cp nfx-*.tar.gz nfx-*.tar.gz.sha256 install.sh "$bridge_dir/"
            printf '%s\n' "$BRIDGE_TAG" > "$bridge_dir/latest.txt"
            gh release create "$BRIDGE_TAG" "$bridge_dir"/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$BRIDGE_TAG" \
              --notes "Compatibility bridge for stable n-fx updaters that require a strict version. The installed binary continues on the n-fx release channel." \
              --latest
          else
            gh release edit "$BRIDGE_TAG" --repo "$GITHUB_REPOSITORY" --latest
          fi
